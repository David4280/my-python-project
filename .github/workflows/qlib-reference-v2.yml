name: Qlib reference build v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install fixed environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqlib==0.9.7 numpy==1.26.4 pandas==2.1.4 lightgbm==4.5.0 scikit-learn==1.5.2 PyYAML==6.0.2 mlflow==2.11.3 openpyxl==3.1.5
      - name: Download and inspect fixed data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qlib_data | Out-Null
          Invoke-WebRequest -Uri "https://github.com/SunsetWolf/qlib_dataset/releases/download/v2/qlib_data_simple_cn_1d_latest.zip" -OutFile "qlib_data.zip"
          if ((Get-Item qlib_data.zip).Length -ne 51810838) { throw "Unexpected archive size" }
          Expand-Archive -Path qlib_data.zip -DestinationPath qlib_data -Force
          Get-ChildItem qlib_data | Format-Table Name,Mode,Length | Out-File data_inventory.txt
      - name: Write workflow config
        shell: pwsh
        run: |
          $config = @'
          qlib_init:
              provider_uri: "./qlib_data"
              region: cn
          market: &market csi300
          benchmark: &benchmark SH000300
          data_handler_config: &data_handler_config
              start_time: 2008-01-01
              end_time: 2020-08-01
              fit_start_time: 2008-01-01
              fit_end_time: 2014-12-31
              instruments: *market
          port_analysis_config: &port_analysis_config
              strategy:
                  class: TopkDropoutStrategy
                  module_path: qlib.contrib.strategy
                  kwargs:
                      signal: <PRED>
                      topk: 50
                      n_drop: 5
              backtest:
                  start_time: 2017-01-01
                  end_time: 2020-08-01
                  account: 100000000
                  benchmark: *benchmark
                  exchange_kwargs:
                      limit_threshold: 0.095
                      deal_price: close
                      open_cost: 0.0005
                      close_cost: 0.0015
                      min_cost: 5
          task:
              model:
                  class: LGBModel
                  module_path: qlib.contrib.model.gbdt
                  kwargs:
                      loss: mse
                      colsample_bytree: 0.8879
                      learning_rate: 0.2
                      subsample: 0.8789
                      lambda_l1: 205.6999
                      lambda_l2: 580.9768
                      max_depth: 8
                      num_leaves: 210
                      num_threads: 2
                      seed: 42
                      feature_fraction_seed: 42
                      bagging_seed: 42
                      data_random_seed: 42
              dataset:
                  class: DatasetH
                  module_path: qlib.data.dataset
                  kwargs:
                      handler:
                          class: Alpha158
                          module_path: qlib.contrib.data.handler
                          kwargs: *data_handler_config
                      segments:
                          train: [2008-01-01, 2014-12-31]
                          valid: [2015-01-01, 2016-12-31]
                          test: [2017-01-01, 2020-08-01]
              record:
                  - class: SignalRecord
                    module_path: qlib.workflow.record_temp
                    kwargs:
                        model: <MODEL>
                        dataset: <DATASET>
                  - class: SigAnaRecord
                    module_path: qlib.workflow.record_temp
                    kwargs:
                        ana_long_short: false
                        ann_scaler: 252
                  - class: PortAnaRecord
                    module_path: qlib.workflow.record_temp
                    kwargs:
                        config: *port_analysis_config
          '@
          $config.TrimStart() | Set-Content -Encoding UTF8 workflow_config.yaml
          Get-Content workflow_config.yaml
      - name: Run Qlib workflow
        id: qrun
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONHASHSEED: '42'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          qrun workflow_config.yaml *>&1 | Tee-Object -FilePath run.log
          echo "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          python --version | Out-File environment.txt
          python -c "import qlib,lightgbm,pandas,numpy,mlflow; print('qlib='+qlib.__version__); print('lightgbm='+lightgbm.__version__); print('pandas='+pandas.__version__); print('numpy='+numpy.__version__); print('mlflow='+mlflow.__version__)" | Out-File -Append environment.txt
          if (Test-Path mlruns) { Get-ChildItem -Recurse mlruns | Select-Object FullName,Length | Out-File artifact_inventory.txt } else { 'mlruns missing' | Out-File artifact_inventory.txt }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QX01-qlib-reference-v2-raw
          path: |
            workflow_config.yaml
            run.log
            environment.txt
            data_inventory.txt
            artifact_inventory.txt
            mlruns
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Qlib success
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.qrun.outputs.exit_code }}' -ne '0') { throw "qrun failed with exit code ${{ steps.qrun.outputs.exit_code }}" }
